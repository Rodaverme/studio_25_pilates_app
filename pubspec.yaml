name: studio_25_pilates_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  animate_do: ^4.2.0
  dio: ^5.9.0
  equatable: ^2.0.7
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_localization: ^0.3.3
  flutter_native_splash: ^2.4.6
  flutter_secure_storage: ^9.2.4
  formz: ^0.8.0
  go_router: ^16.1.0
  intl: ^0.20.2
  smooth_page_indicator: ^1.2.1
  


dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/   # 👉 Esto incluye TODAS las imágenes dentro de la carpeta
    - assets/icon/    # 👉 Puedes agregar otra carpeta si tienes íconos

  fonts:
    - family: Sculpin
      fonts:
      - asset: assets/fonts/fonnts.com-Sculpin_Regular.otf
        weight: 400
      - asset: assets/fonts/fonnts.com-Sculpin_Regular_Italic.otf
        weight: 400
        style: italic
      - asset: assets/fonts/fonnts.com-Sculpin_Light.otf
        weight: 300
      - asset: assets/fonts/fonnts.com-Sculpin_Light_Italic.otf
        weight: 300
        style: italic
      - asset: assets/fonts/fonnts.com-Sculpin_Medium.otf
        weight: 500
      - asset: assets/fonts/fonnts.com-Sculpin_Bold.otf
        weight: 700
      - asset: assets/fonts/fonnts.com-Sculpin_Bold_Italic.otf
        weight: 700
        style: italic
      - asset: assets/fonts/fonnts.com-Sculpin_Black.otf
        weight: 900
      - asset: assets/fonts/fonnts.com-Sculpin_Black_Italic.otf
        weight: 900
        style: italic
      - asset: assets/fonts/fonnts.com-Sculpin_Variable_Light.otf
        weight: 200
      - asset: assets/fonts/fonnts.com-Sculpin_Variable_Light_Italic.otf
        weight: 200
        style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo_estudio25_512x512.png"
  min_sdk_android: 21
