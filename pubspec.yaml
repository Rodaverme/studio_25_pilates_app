name: studio_25_pilates_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  dio: ^5.9.0
  equatable: ^2.0.7
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^9.2.4
  formz: ^0.8.0
  go_router: ^16.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Sculpin
      fonts:
        - asset: assets/fonts/fonnts.com-Sculpin_Regular.otf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo_estudio25_512x512.png"
  min_sdk_android: 21
